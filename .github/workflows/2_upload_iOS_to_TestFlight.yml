name: 2_upload_iOS_to_TestFlight

# Сборка подписанного iOS-приложения и загрузка в TestFlight.
# Подпись — автоматическая через App Store Connect API key:
# сертификат и профиль Xcode создаёт/берёт сам, Mac не нужен.
#
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       — Team ID (developer.apple.com → Membership details)
#   ASC_KEY_ID          — Key ID ключа App Store Connect API
#   ASC_ISSUER_ID       — Issuer ID (там же, над списком ключей)
#   ASC_KEY_P8          — полное содержимое файла AuthKey_XXXXXXXXXX.p8

on:
  workflow_dispatch:

jobs:
  testflight:
    name: 🚀 iOS → TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      # App Store принимает только сборки на актуальном SDK
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Check secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "❌ Secret $v is empty"; exit 1; fi
          done

      - name: Save App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Номер сборки должен расти с каждой загрузкой в TestFlight.
      # Версия (1.0.0) берётся из pubspec.yaml.
      - name: Set build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Flutter iOS config
        run: flutter build ios --release --config-only --no-codesign --build-number=$BUILD_NUMBER

      - name: Install CocoaPods
        working-directory: ios
        run: |
          for i in 1 2 3; do
            pod install --repo-update && break
            echo "Retry in 10s..."; sleep 10
          done

      - name: Archive (signed)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Export & upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "✅ Build $BUILD_NUMBER uploaded. It will appear in TestFlight after processing (5–30 min)."

      - name: Remove API key
        if: always()
        run: rm -rf "$HOME/private_keys"
